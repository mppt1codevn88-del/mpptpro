# Đặt file này tại: .github/workflows/build-firmware.yml
#
# Cách dùng:
#   - Đẩy code lên nhánh main như bình thường -> workflow tự build để kiểm tra
#     lỗi (không tạo release).
#   - Muốn phát hành bản chính thức: tạo & đẩy 1 "tag" dạng vX (ví dụ v3):
#       git tag v3
#       git push origin v3
#     -> workflow tự build, tạo RA 2 FILE RIÊNG BIỆT (xem giải thích bên dưới),
#     tạo GitHub Release, và đẩy cả 2 file sang repo Public firmware_bomppt.
#
# ============================================================
# TẠI SAO CẦN 2 FILE RIÊNG (đây là nguyên nhân gốc của lỗi OTA
# "Mismatch chip id... found 65535" từng gặp):
#   - firmware_vX_app.bin  : CHỈ chứa app (idf.py build tạo ra, TRƯỚC khi
#                            gộp) -> dùng cho OTA QUA WIFI (esp_https_ota chỉ
#                            ghi đè đúng phần app, không đụng bootloader).
#   - firmware_vX_full.bin : Gộp bootloader + bảng phân vùng + app (esptool
#                            merge_bin) -> CHỈ dùng để nạp TOÀN BỘ qua USB ở
#                            offset 0x0 (Phương án 2 khi mất sạch firmware).
# Trước đây dùng NHẦM file "full" (gộp) làm link OTA — vì bootloader không
# nằm ở đầu file, phần đầu file "full" là vùng ĐỆM TRỐNG (byte 0xFF) cho tới
# đúng vị trí bootloader thật -> esp_https_ota đọc trúng vùng đệm trống đó,
# báo "Mismatch chip id... found 65535 (=0xFFFF)". Đây là lỗi khái niệm, không
# phải lỗi Git/lỗi mạng như các giả thuyết trước.
#
# ============================================================
# PHIÊN BẢN ESP-IDF PHẢI TRÙNG VỚI BOOTLOADER ĐANG NẰM TRÊN CHIP
#   Bootloader KHÔNG BAO GIỜ được thay qua OTA — chỉ nạp cáp USB mới thay được.
#   App build bằng IDF khác dòng sẽ chạy trên môi trường khởi động không khớp
#   và chết ngay lúc boot (INT_WDT), rồi bị bootloader quay lui. Firmware đã có
#   lớp chặn: đọc idf_ver trong file .bin và TỪ CHỐI cài nếu khác major.minor.
# ============================================================

name: Build & Release Firmware

# QUAN TRỌNG: mặc định GITHUB_TOKEN chỉ có quyền ĐỌC, khiến bước "Tạo GitHub
# Release" bên dưới bị từ chối (403) một cách ÂM THẦM. Khai báo rõ quyền ghi.
permissions:
  contents: write

on:
  push:
    branches: [main]      # build thử mỗi khi đẩy code lên main (không release)
    tags: ['v*']           # đẩy tag vX -> build + release chính thức
  workflow_dispatch:        # cho phép bấm nút "Run workflow" chạy tay trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code từ repo
        uses: actions/checkout@v4

      # ============================================================
      # CHỐT CHẶN CẤU HÌNH: file `sdkconfig` bị .gitignore nên KHÔNG lên GitHub.
      # Nếu thiếu `sdkconfig.defaults`, CI sẽ build bằng TOÀN BỘ giá trị mặc
      # định — khác hẳn cấu hình trong menuconfig ở máy, và cho ra firmware
      # trông "build thành công" nhưng chạy sai (ví dụ: bộ chứng chỉ gốc rút
      # gọn -> mất kết nối Firebase, stack main task quá nhỏ -> tràn stack).
      # Dừng ngay ở đây còn hơn phát hành một bản .bin hỏng.
      # ============================================================
      - name: Kiểm tra sdkconfig.defaults có tồn tại
        run: |
          if [ ! -f sdkconfig.defaults ]; then
            echo "::error::Thieu sdkconfig.defaults. Chay 'idf.py save-defconfig' o may roi commit file do."
            exit 1
          fi
          echo "### ⚙️ Cấu hình build (sdkconfig.defaults)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -v '^\s*#' sdkconfig.defaults | grep -v '^\s*$' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build bằng ESP-IDF (phải TRÙNG phiên bản với bootloader trên chip)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version:  v6.0.2  
          target: esp32c5
          # LƯU Ý CÚ PHÁP: dùng "|" (literal block) chứ KHÔNG dùng ">" (folded).
          # ">" gộp mọi dòng thành 1 dòng và làm hỏng dấu nháy trong lệnh, từng
          # gây lỗi: NameError: name 'build' is not defined.
          #
          # ★ LƯU Ý THÊM (lỗi mới gặp): action này CŨNG xử lý sai khi trong
          # "command" có ký tự "|" ở BẤT KỲ ĐÂU, kể cả nằm gọn trong dấu nháy
          # đơn của 1 lệnh grep -E (dùng "|" làm regex alternation). Nó tách
          # nhầm chuỗi tại từng dấu "|" đó rồi cố chạy từng mảnh như 1 lệnh
          # riêng -> "CONFIG_ESP_MAIN_TASK_STACK_SIZE: command not found".
          # KHÔNG dùng bất kỳ dấu "|" nào (pipe lẫn regex alternation) trong
          # khối "command" này, kể cả trong dấu nháy. Bước in cấu hình để đối
          # chiếu đã dời ra 1 step RIÊNG chạy shell bình thường trên runner
          # (xem step "In cấu hình đã build" ngay sau step này).
          #
          # esp32c5_Batt_v0.bin = tên app image (theo tên project trong
          # CMakeLists.txt gốc). Nếu sau này đổi tên project, sửa lại dòng cp.
          command: |
            idf.py build
            cp build/esp32c5_Batt_v0.bin firmware_app.bin
            cd build
            esptool.py --chip esp32c5 merge_bin -o ../firmware_full.bin @flash_args
            cd ..

      # Đọc lại sdkconfig do CI SINH RA (không phải sdkconfig.defaults ta commit)
      # để đối chiếu xem các tuỳ chọn quyết định có thật sự vào bản build hay
      # không. Chạy trên runner bình thường (không qua action ở trên) nên
      # không dính lỗi phân tách "|" như đã ghi chú ở step build.
      - name: In cấu hình đã build (đối chiếu nhanh khi có sự cố)
        run: |
          echo "----- CAU HINH THAT SU DUOC BUILD -----"
          if [ -f sdkconfig ]; then
            grep -E "CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT" sdkconfig || true
            grep -E "CONFIG_ESP_MAIN_TASK_STACK_SIZE" sdkconfig || true
            grep -E "CONFIG_PARTITION_TABLE" sdkconfig || true
            grep -E "CONFIG_ESPTOOLPY_FLASHSIZE=" sdkconfig || true
            grep -E "CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE" sdkconfig || true
          else
            echo "::warning::Khong tim thay file sdkconfig sau khi build."
          fi

      - name: Đặt tên file kèm số phiên bản
        run: |
          SAFE_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv firmware_app.bin "firmware_${SAFE_NAME}_app.bin"
          mv firmware_full.bin "firmware_${SAFE_NAME}_full.bin"
          echo "ASSET_APP=firmware_${SAFE_NAME}_app.bin" >> $GITHUB_ENV
          echo "ASSET_FULL=firmware_${SAFE_NAME}_full.bin" >> $GITHUB_ENV

      - name: Lưu làm Artifact (luôn chạy — xem/tải tạm thời trong tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ${{ env.ASSET_APP }}
            ${{ env.ASSET_FULL }}
          retention-days: 30

      - name: Tạo GitHub Release (chỉ khi đẩy tag vX)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_APP }}
            ${{ env.ASSET_FULL }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # repo mpptpro (chứa mã nguồn) là PRIVATE — raw.githubusercontent.com
      # không phục vụ được nội dung repo Private cho request không đăng nhập
      # -> đẩy 2 file .bin sang repo PUBLIC RIÊNG (firmware_bomppt), dùng SSH
      # Deploy Key (chỉ có quyền trên đúng repo đó, không có hạn dùng).
      # ============================================================
      - name: Nạp SSH deploy key để đẩy sang firmware_bomppt
        if: startsWith(github.ref, 'refs/tags/')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FIRMWARE_DEPLOY_SSH_KEY }}

      - name: Đẩy 2 file firmware sang repo Public firmware_bomppt (qua SSH)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp ${{ env.ASSET_APP }} /tmp/${{ env.ASSET_APP }}
          cp ${{ env.ASSET_FULL }} /tmp/${{ env.ASSET_FULL }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone git@github.com:mppt1codevn88-del/firmware_bomppt.git /tmp/firmware_repo
          cd /tmp/firmware_repo
          mkdir -p firmware

          # Khai báo *.bin là NHỊ PHÂN trước khi commit, tránh Git tự "sửa"
          # byte xuống dòng (dù không phải nguyên nhân chính lần này, vẫn nên
          # giữ để phòng ngừa lâu dài).
          if ! grep -q '\*.bin binary' .gitattributes 2>/dev/null; then
            echo "*.bin binary" >> .gitattributes
            git add .gitattributes
          fi

          cp /tmp/${{ env.ASSET_APP }} firmware/${{ env.ASSET_APP }}
          cp /tmp/${{ env.ASSET_FULL }} firmware/${{ env.ASSET_FULL }}
          git add -f firmware/${{ env.ASSET_APP }} firmware/${{ env.ASSET_FULL }}
          git diff --staged --quiet && echo "Khong co gi moi de commit, bo qua." || \
            (git commit -m "Them firmware ${{ github.ref_name }} (app + full, tu dong tu CI cua mpptpro)" && git push)

          echo "### 🔗 Link OTA qua WiFi (dùng link này cho Code Backup / OTA_DEFAULT_URL / Admin):" >> $GITHUB_STEP_SUMMARY
          echo "\`https://raw.githubusercontent.com/mppt1codevn88-del/firmware_bomppt/main/firmware/${{ env.ASSET_APP }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Link nạp FULL qua USB (dùng cho nút Tải file firmware.bin / Flash Download Tools):" >> $GITHUB_STEP_SUMMARY
          echo "\`https://raw.githubusercontent.com/mppt1codevn88-del/firmware_bomppt/main/firmware/${{ env.ASSET_FULL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Nếu nhánh mặc định của firmware_bomppt KHÔNG phải \`main\` (vd \`master\`), sửa lại URL trên cho đúng." >> $GITHUB_STEP_SUMMARY