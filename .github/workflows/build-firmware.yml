# Đặt file này tại: .github/workflows/build-firmware.yml
#
# Cách dùng:
#   - Đẩy code lên nhánh main như bình thường -> workflow tự build để kiểm tra
#     lỗi (không tạo release).
#   - Muốn phát hành bản chính thức: tạo & đẩy 1 "tag" dạng vX (ví dụ v3):
#       git tag v3
#       git push origin v3
#     -> workflow tự build + gộp file + tạo GitHub Release, đính kèm file
#     .bin gộp sẵn, có link tải công khai để dùng cho "Phương án 2" trong app.

name: Build & Release Firmware

# QUAN TRỌNG: mặc định GITHUB_TOKEN chỉ có quyền ĐỌC, khiến bước "Tạo GitHub
# Release" bên dưới bị từ chối (403) một cách ÂM THẦM — tag vẫn được tạo (vì
# đó là do máy bạn `git push` tag lên, không liên quan tới Action), nhưng
# Action không tạo được Release + không đính kèm được file .bin. Khai báo rõ
# quyền ghi ở đây để sửa dứt điểm.
permissions:
  contents: write

on:
  push:
    branches: [main]      # build thử mỗi khi đẩy code lên main (không release)
    tags: ['v*']           # đẩy tag vX -> build + release chính thức
  workflow_dispatch:        # cho phép bấm nút "Run workflow" chạy tay trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code từ repo
        uses: actions/checkout@v4

      - name: Build bằng ESP-IDF (v5.5 trở lên mới hỗ trợ chính thức ESP32-C5)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32c5
          # Build xong thì cd vào build/, dùng flash_args (đã tính sẵn theo
          # sdkconfig) để gộp bootloader + partition table + app thành 1 file.
          command: >
            idf.py build &&
            cd build &&
            esptool.py --chip esp32c5 merge_bin -o ../firmware_merged.bin @flash_args

      - name: Đặt tên file kèm số phiên bản
        run: |
          SAFE_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv firmware_merged.bin "firmware_${SAFE_NAME}.bin"
          echo "ASSET_NAME=firmware_${SAFE_NAME}.bin" >> $GITHUB_ENV

      - name: Lưu làm Artifact (luôn chạy — xem/tải tạm thời trong tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ${{ env.ASSET_NAME }}
          retention-days: 30

      - name: Tạo GitHub Release (chỉ khi đẩy tag vX)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # QUAN TRỌNG: Link "releases/download/..." đôi khi TẢI THẤT BẠI trên
      # ESP32 (phải qua 1 bước chuyển hướng phức tạp sang máy chủ khác kèm
      # link rất dài, dễ gây lỗi "Mismatch chip id" khi OTA). Bước này tự
      # commit thẳng file .bin vào code repo (mỗi bản 1 tên file riêng,
      # KHÔNG đè bản cũ) để có link "raw.githubusercontent.com" — tải trực
      # tiếp, không chuyển hướng, ổn định hơn nhiều cho vi điều khiển.
      # Vì không đè file cũ, link của v1 không bao giờ đổi -> dùng cố định
      # cho "Code Backup" (Phương án 1) là an toàn tuyệt đối.
      # ============================================================
      - name: Đưa file firmware vào repo (để có link raw.githubusercontent.com ổn định)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p firmware
          cp ${{ env.ASSET_NAME }} firmware/${{ env.ASSET_NAME }}
          git add firmware/${{ env.ASSET_NAME }}
          git commit -m "Them firmware binary ${{ github.ref_name }} (tu dong tu CI)"
          git push origin main
          echo "### 🔗 Link OTA ổn định (dùng link này, KHÔNG dùng link Releases ở trên):" >> $GITHUB_STEP_SUMMARY
          echo "\`https://raw.githubusercontent.com/${{ github.repository }}/main/firmware/${{ env.ASSET_NAME }}\`" >> $GITHUB_STEP_SUMMARY
